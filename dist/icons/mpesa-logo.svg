<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Red Safaricom Arc / Swoosh -->
  <path d="M 40 70 C 45 42, 70 28, 120 28 C 75 32, 52 48, 48 70 Z" fill="#e30613" />
  
  <!-- Safaricom text -->
  <text x="60" y="66" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" fill="#00b050" letter-spacing="-0.5">Safaricom</text>
  
  <!-- Vertical divider -->
  <line x1="236" y1="36" x2="236" y2="72" stroke="#444a4e" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- m-pesa text with icon -->
  <g transform="translate(248, 36)">
    <!-- Small phone icon inside m -->
    <rect x="22" y="5" width="13" height="23" rx="2.5" fill="#1e2224" stroke="#00b050" stroke-width="1.8"/>
    <!-- phone red screen accent -->
    <path d="M 23 18 L 29 11 L 34 16 L 34 26 L 23 26 Z" fill="#e30613" />
    
    <text x="0" y="30" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="33" fill="#00b050" letter-spacing="-0.5">m<tspan dx="13">pesa</tspan></text>
  </g>
</svg>
