[build]
  base = "frontend"
  command = "npm exec --yes --package=node@24.15.0 --call 'node --version && npm ci --include=dev && npm run build'"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
