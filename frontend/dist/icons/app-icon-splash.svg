<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="200" height="200" rx="46" ry="46" />
    </clipPath>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)" filter="url(#iconShadow)">
    <!-- Top Green Background -->
    <rect x="0" y="0" width="200" height="135" fill="#28b446" />
    
    <!-- Red Swoosh Arc around S -->
    <path d="M 36 102 C 34 85, 48 56, 92 48 C 128 42, 160 52, 164 68 C 158 56, 125 48, 88 56 C 50 64, 40 88, 42 102 Z" fill="#e50914" />
    <path d="M 36 102 C 38 106, 52 108, 96 98 C 70 106, 44 106, 36 102 Z" fill="#e50914" />
    
    <!-- Bold White S in Center -->
    <text x="100" y="103" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="78" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="-2">S</text>

    <!-- Bottom White Background Section -->
    <rect x="0" y="132" width="200" height="68" fill="#ffffff" />

    <!-- Safaricom | m-pesa branding in white lower section -->
    <g transform="translate(18, 146)">
      <!-- Safaricom red swoosh -->
      <path d="M 6 18 C 10 9, 22 7, 34 8 C 20 9, 11 12, 9 18 Z" fill="#e50914" />
      <!-- Safaricom text -->
      <text x="14" y="17" 
            font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
            font-weight="800" 
            font-size="14.5" 
            fill="#28b446" 
            letter-spacing="-0.3">Safaricom</text>
      
      <!-- Divider -->
      <line x1="88" y1="5" x2="88" y2="20" stroke="#a0aab2" stroke-width="1.2" />

      <!-- m-pesa text -->
      <g transform="translate(93, 2)">
        <text x="0" y="15" 
              font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
              font-weight="900" 
              font-size="14.5" 
              fill="#28b446" 
              letter-spacing="-0.3">m<tspan dx="8">pesa</tspan></text>
        <!-- Phone symbol in m -->
        <rect x="11.5" y="4" width="6" height="11" rx="1.2" fill="#28b446" />
        <rect x="12.5" y="7" width="4" height="5" rx="0.5" fill="#e50914" />
      </g>
    </g>
  </g>
</svg>
